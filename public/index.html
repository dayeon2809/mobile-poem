<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>다시 쓰는 몸 · 나의 몸의 시</title>
  <link rel="stylesheet" href="style.css">
  <script src="survey.js" defer></script>
  <script src="space.js" defer></script>
<link rel="stylesheet" href="/projection.css"><script src="/projection.js" defer></script>
</head>
<body class="projection-survey">
  <canvas id="space" aria-hidden="true"></canvas>
  <main class="shell">
    <a class="brand" href="/">RE:CHOREOGRAPH <span>다시 쓰는 몸</span></a>
    <section id="welcome" class="panel">
      <img class="poster" src="poster-2.png" alt="Re:Choreograph 다시 쓰는 몸 2.0 포스터">
      <div class="welcome-copy">
      <h1>&lt;Re:Choreograph 다시 쓰는 몸&gt;<br>전시에 오신 것을 환영합니다.</h1>
      <p class="intro">각자의 다른 출발점으로부터 처음의 의미가 분해되어<br>새로운 의미를 만들어가는 순환을 느껴보세요.<br><br>이제, 감정의 문을 열어볼까요?</p>
      <label for="name">이름 또는 별명 <span class="muted">선택 사항</span></label>
      <input id="name" maxlength="30" autocomplete="nickname" placeholder="익명으로 참여할 수 있어요">
      <p class="note">응답은 시 생성과 저장에 사용됩니다. 완성된 시와 별명은 몸의 시 전시 화면에 공개되며 QR과 결과 링크로도 볼 수 있습니다.</p>
      <button id="start" class="primary" disabled>불러오는 중…</button>
      </div>
    </section>
    <section id="survey" class="panel" hidden>
      <h1 id="question" tabindex="-1"></h1>
      <p id="hint" class="muted"></p>
      <div id="options" class="options"></div>
      <p id="selected" aria-live="polite"></p>
      <label id="text-label" for="answer" hidden>몸이 하고 싶은 말</label>
      <textarea id="answer" rows="4" maxlength="500" placeholder="예: 몸이 나에게 말한다, 잠시 쉬어도 괜찮다고." hidden></textarea>
      <div class="actions"><button id="back" class="secondary">이전</button><button id="next" class="primary">다음</button></div>
      <progress id="progress" max="9" value="1" aria-label="설문 진행률"></progress>
      <div class="progress-label"><span id="step"></span></div>
      <p id="status" role="status" aria-live="polite"></p>
    </section>
    <p id="load-error" role="alert"></p>
    <footer>감정에서 움직임으로, 움직임에서 시로.</footer>
  </main>
</body>
</html>
